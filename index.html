<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>謎解き手帖 — 公演の感想・成績・教訓</title>
<style>
:root{
  --bg:#12131a;--panel:#1b1d27;--panel2:#242736;--line:#2e3144;--text:#ecedf3;--sub:#9da1b5;
  --accent:#ffb84d;--teal:#5eead4;--pink:#ff6b81;--gold:#fbbf24;
  --radius:14px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic UI",system-ui,sans-serif;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
input[type=date],input[type=time]{color-scheme:dark;cursor:pointer}
header{position:sticky;top:0;z-index:20;background:rgba(18,19,26,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{max-width:1400px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-weight:800;font-size:18px;letter-spacing:.04em}
.logo b{color:var(--accent)}
nav{display:flex;gap:4px;flex:1;flex-wrap:wrap}
nav button{background:none;border:0;padding:8px 14px;border-radius:999px;color:var(--sub);cursor:pointer;font-weight:600}
nav button.on{background:var(--panel2);color:var(--text)}
nav{display:flex;flex-wrap:wrap;gap:2px}
.chip{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--sub);cursor:pointer}
.chip.ok{color:var(--teal);border-color:#2a5b55}
.chip.bad{color:var(--gold);border-color:#6b5a1c}
main{max-width:1400px;margin:0 auto;padding:18px 16px 80px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.toolbar select,.toolbar input[type=text],.field input,.field select,.field textarea,.panel input[type=text]{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.toolbar input[type=text]{min-width:220px;flex:1}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--sub)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#2a1a00}
.btn.danger{color:#ff9aa8}
.stick{position:sticky;top:var(--hh,56px);z-index:15;background:var(--bg);padding:12px 0 2px;margin:-12px 0 8px;border-bottom:1px solid var(--line)}
.hint{font-size:12.5px;color:var(--sub)}
.empty{padding:50px 10px;text-align:center;color:var(--sub);line-height:1.9}
.gh{margin:18px 0 8px;padding:4px 2px;font-size:17px;border-bottom:2px solid var(--accent)}
.gh small{font-size:12px;color:var(--sub);font-weight:400;margin-left:8px}
/* record row */
.rec{display:grid;grid-template-columns:170px minmax(0,1fr) 330px;gap:16px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px}
.rec:hover{border-color:#4a4f6e}
.rl{display:flex;flex-direction:column;gap:5px;align-items:flex-start}
.dt{font-size:13px;color:var(--sub);white-space:nowrap}
.grp{font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line)}
.fm{font-size:12px;color:var(--sub)}
.rm{min-width:0;cursor:pointer}
.ttl{font-size:16px;font-weight:700;line-height:1.4}
.imp{font-size:13px;color:#c9ccdc;white-space:pre-wrap;margin-top:4px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.les{font-size:13px;color:var(--accent);white-space:pre-wrap;margin-top:6px;padding:6px 10px;border-left:3px solid var(--accent);background:rgba(255,184,77,.07);border-radius:0 8px 8px 0}
.rec.open .imp{display:block;-webkit-line-clamp:unset;overflow:visible}
.rr{display:flex;flex-direction:column;gap:7px}
.res{display:flex;gap:4px}
.rb{flex:1;padding:8px 0;border-radius:8px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-weight:700;font-size:13px;color:var(--sub)}
.rb:hover{color:var(--text);border-color:var(--sub)}
.rb.on.big{background:#3a2f0b;border-color:#8a6f1c;color:var(--gold)}
.rb.on.ok{background:#16312f;border-color:#2a5b55;color:var(--teal)}
.rb.on.ng{background:#35171e;border-color:#7a2f3d;color:var(--pink)}
.sbs{display:flex;gap:3px}
.sb{flex:1;min-width:0;padding:7px 0;border-radius:7px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-weight:700;font-size:13px;color:var(--sub)}
.sb:hover{border-color:var(--accent);color:var(--text)}
.sb.on{background:var(--accent);border-color:var(--accent);color:#2a1a00}
.qb{align-self:flex-end;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 12px;cursor:pointer;font-size:13px;color:var(--sub)}
a.qb{text-decoration:none;display:inline-block;color:var(--teal)}
.qb:hover{border-color:var(--sub);color:var(--text)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 9px;border-radius:99px;margin-right:6px}
.tag.big{background:#3a2f0b;color:var(--gold)}.tag.ok{background:#16312f;color:var(--teal)}.tag.ng{background:#35171e;color:var(--pink)}
@media(max-width:960px){.rec{grid-template-columns:1fr}.rl{flex-direction:row;flex-wrap:wrap;align-items:center}.qb{align-self:flex-start}}
/* panels / stats */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px}
.panel h2{margin:0 0 10px;font-size:17px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.tile .k{font-size:12px;color:var(--sub)}
.tile .v{font-size:26px;font-weight:800;line-height:1.3}
.tile .v small{font-size:13px;color:var(--sub);font-weight:500;margin-left:4px}
.brow{display:grid;grid-template-columns:150px 1fr 150px;gap:10px;align-items:center;font-size:13px;margin:6px 0}
.brow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{height:12px;background:var(--panel2);border-radius:99px;overflow:hidden;display:flex}
.track i{display:block;height:100%}
.track .s-big{background:var(--gold)}.track .s-ok{background:var(--teal)}.track .s-ng{background:var(--pink)}.track .s-none{background:#4a4f6e}
.brow .st{color:var(--sub);text-align:right;white-space:nowrap}
.fbtns{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 10px}
.fbtns .lb2{font-size:12px;color:var(--sub);margin-right:2px}
.fb{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:5px 13px;cursor:pointer;font-size:13px;font-weight:600;color:var(--sub)}
.fb:hover{border-color:var(--sub);color:var(--text)}
.fb.on{background:var(--accent);border-color:var(--accent);color:#2a1a00}
.fb small{opacity:.75;font-weight:500;margin-left:3px}
.pl{font-size:11px;font-weight:700;padding:1px 9px;border-radius:99px;background:#1d2b4a;color:#8ab4ff;border:1px solid #34508f}
.pl.t{background:#2a2540;color:#c3b1ff;border-color:#4f4390}
.un{font-size:11px;font-weight:700;padding:1px 9px;border-radius:99px;background:#3a2f0b;color:var(--gold);border:1px solid #6b5a1c}
.seg{display:flex;gap:4px}.seg .fb{flex:1;border-radius:10px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--sub);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
@media(max-width:720px){.brow{grid-template-columns:96px 1fr 96px}}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:960px){.two{grid-template-columns:1fr}}
.lcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px}
.lcard .lt{font-size:13px;color:var(--sub)}
.lcard .lb{white-space:pre-wrap;margin-top:4px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:18px;max-width:780px;width:100%;padding:18px}
.modal h2{margin:0 0 12px;font-size:19px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:13px;color:var(--sub)}
.field textarea{min-height:130px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:720px){.grid2{grid-template-columns:1fr}}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#000;border:1px solid var(--line);padding:10px 18px;border-radius:999px;z-index:99;font-size:14px}
footer{max-width:1400px;margin:0 auto;padding:0 16px 40px;color:var(--sub);font-size:12px}
.rc{display:grid;grid-template-columns:150px minmax(0,1fr) 130px;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px}
.rc.done{opacity:.6}
.rcgrid.c2{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}
.rcgrid.c2 .rc{grid-template-columns:1fr;gap:8px;margin-bottom:0}
.rcgrid.c2 .rc .rl2{flex-direction:row;flex-wrap:wrap;align-items:center}
.rcgrid.c2 .rc .lk{flex-direction:row;align-items:center;justify-content:space-between}
@media(max-width:720px){.rcgrid.c2{grid-template-columns:1fr}.rcColBtn{display:none}}
.rc .rl2{display:flex;flex-direction:column;gap:5px;align-items:flex-start;font-size:13px;color:var(--sub)}
.rc .why{font-size:13px;color:var(--accent);margin-top:6px}
.rc .meta{font-size:13px;color:var(--sub);margin-top:3px}
.rc a{color:var(--teal);text-decoration:none;font-size:13px;font-weight:600}
.rc .lk{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.rc .rcAdd{white-space:nowrap;padding:6px 12px}
.rdn{font-size:11px;font-weight:700;padding:1px 9px;border-radius:99px;background:#16312f;color:var(--teal);border:1px solid #2a5b55}
.soon{font-size:11px;font-weight:700;padding:1px 9px;border-radius:99px;background:#35171e;color:var(--pink);border:1px solid #7a2f3d}
@media(max-width:720px){.rc{grid-template-columns:1fr}.rc .lk{align-items:flex-start;flex-direction:row}}
.subtabs{display:flex;gap:6px;margin:0 0 10px}
.subtabs button{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 6px;cursor:pointer;font-weight:700;color:var(--sub)}
.subtabs button.on{background:var(--panel2);border-color:var(--accent);color:var(--text)}
.subtabs small{opacity:.7;margin-left:5px;font-weight:500}
.gcal.gdone{color:var(--teal);border-color:#2a5b55}
.hlinks{display:flex;gap:6px;flex-wrap:wrap}
.hlinks a{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);color:var(--teal);text-decoration:none;font-weight:600;white-space:nowrap}
.hlinks a:hover{border-color:var(--teal)}
.curtab{display:none;font-size:13px;color:var(--sub)}
nav button small{font-size:11px;margin-left:5px;padding:0 7px;border-radius:99px;background:var(--panel2);color:var(--sub);font-weight:700}
nav button small.wn{background:#3b1c1c;color:#ff9a9a}
#gearBtn{padding:6px 11px;font-size:16px;line-height:1.2}
#gearBtn.on{border-color:var(--accent)}
.subtabs.sm button{flex:none;padding:7px 16px}
.bycard{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px}
.bycard .pr{font-size:19px;font-weight:800;color:var(--accent);white-space:nowrap}
.bycard .pr small{display:block;font-size:12px;color:var(--sub);font-weight:500}
.bycard .meta{font-size:13px;color:var(--sub);margin-top:3px}
.bycard .btn{text-decoration:none;display:inline-block;font-size:14px}
.bycard a.btn{color:var(--text)}
.bycard a.btn.pri{color:#2a1a00}
.totbar{display:flex;gap:16px;flex-wrap:wrap;align-items:baseline;margin:0 0 10px;font-size:13px;color:var(--sub)}
.totbar b{font-size:20px;color:var(--text);margin:0 3px}
@media(max-width:720px){.bycard{grid-template-columns:1fr;gap:4px}}
#hdrToggle{display:none;padding:6px 12px}
@media(max-width:720px){
  .bar{padding:8px 12px;gap:8px}
  .logo{order:1;font-size:16px}
  .curtab{display:none}
  #hdrToggle{display:block;order:3;margin-left:auto}
  nav{order:4;flex:1 1 100%;flex-wrap:nowrap;overflow-x:auto;gap:2px;-webkit-overflow-scrolling:touch}
  nav button{white-space:nowrap;padding:7px 12px;flex:none}
  #nzBtn,#addBtn,#syncChip,.hlinks,#gearBtn{order:5}
  header.collapsed #nzBtn,header.collapsed #addBtn,header.collapsed #syncChip,header.collapsed .hlinks,header.collapsed #gearBtn{display:none}
  /* 閉じているときは「実績」「予定」（と今開いているタブ）だけを出す */
  header.collapsed nav{order:2;flex:1 1 0;min-width:0}
  header.collapsed nav button{padding:6px 10px}
  header.collapsed nav button small{margin-left:3px;padding:0 5px}
  header.collapsed nav button:not([data-tab=done]):not([data-tab=plan]):not(.on){display:none}
  main{padding:12px 10px 80px}
  .stick{position:static;margin:0 0 8px;padding:0 0 6px}
  .toolbar{gap:8px}
  .toolbar input[type=text]{min-width:0;flex:1 1 100%}
  .toolbar select{flex:1 1 calc(50% - 8px);min-width:0}
  .rec{padding:10px 12px;gap:10px}
  .ttl{font-size:15px;overflow-wrap:anywhere}
  .res .rb{padding:9px 0}
  .modal{border-radius:14px;padding:14px}
  .ov{padding:10px 6px}
}
.wk{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px}
.wkt{font-size:20px;font-weight:800;color:var(--accent);line-height:1.3}
.wk .meta{font-size:13px;color:var(--sub);margin-top:3px}
.wk .btn{text-decoration:none;display:inline-block;font-size:14px}
.wk a.btn{color:var(--text)}
.wk a.btn.pri{color:#2a1a00}
.wkt{white-space:nowrap}
@media(max-width:720px){.wk{grid-template-columns:1fr;gap:4px}.wkt{font-size:17px}}
.warn{font-size:11px;font-weight:700;padding:1px 9px;border-radius:99px;background:#3b1c1c;color:#ff9a9a;border:1px solid #8a3a3a}
.warnbar{background:#3b1c1c;border:1px solid #8a3a3a;color:#ffb3b3;border-radius:10px;padding:8px 12px;margin:0 0 10px;font-size:13.5px;font-weight:600}
.wk.nt{border-color:#8a3a3a}
.wn{margin-left:4px;color:#ff9a9a;font-weight:700}
</style>

<body>
<header><div class="bar">
  <div class="logo">謎解き<b>手帖</b></div>
  <span id="curTab" class="curtab"></span>
  <button class="btn" id="hdrToggle" type="button" aria-label="メニューを開閉">☰</button>
  <nav id="nav"></nav>
  <button class="btn" id="nzBtn">謎ログに反映</button>
  <button class="btn pri" id="addBtn">＋ 追加</button>
  <span class="hlinks"><a href="https://realdgame.jp/shop/nagoya/" target="_blank" rel="noopener noreferrer">リアル脱出ゲーム名古屋店 ↗</a><a href="https://escape.id/" target="_blank" rel="noopener noreferrer">ESCAPE.ID ↗</a></span>
  <span id="syncChip" class="chip"></span>
  <button class="btn" id="gearBtn" type="button" title="設定" aria-label="設定">⚙</button>
</div></header>
<main id="main"></main>
<footer>感想・成績はこのブラウザと（連携すれば）あなたのGoogle Driveにだけ保存されます。このサイト自体にはデータは含まれていません。</footer>
<div id="modalRoot"></div>

<script>
'use strict';
/* =============== utils =============== */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nowIso=()=>new Date().toISOString();
/* 更新時刻は「既存の値より必ず新しい」ものにする。取り込み等で未来の時刻が入っていても、手元の編集が同期で負けて消えるのを防ぐ */
function stampAfter(old){const n=nowIso(),o=(old&&old.updated_at)||'';if(o&&o>=n){const t=Date.parse(o);return new Date((isNaN(t)?Date.now():t)+1).toISOString()}return n}
function lsGet(k,def){try{const v=localStorage.getItem(k);return v?JSON.parse(v):def}catch(e){return def}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
function toast(msg,ms=2600){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),ms)}
const WD='日月火水木金土';
function fmtDate(d){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(d||'');if(!m)return '日付なし';const dt=new Date(+m[1],+m[2]-1,+m[3]);return m[1]+'/'+m[2]+'/'+m[3]+'（'+WD[dt.getDay()]+'）'}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function newId(){return 'n_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}

/* =============== state =============== */
// localStorageは同じgithub.ioの別サイトと共有されるため、サイト固有のプレフィックスを付ける
const LS_DB='nazotokidb.v1',LS_SET='nazotokidb.settings.v1';
const DRIVE_FILE='nazotoki-db.json';
// OAuthクライアントIDは公開されても安全な識別子（秘密ではない）
const DEFAULT_CLIENT_ID='568813131190-9pb3hf0f3g3rbiglkq4nbk88g4eltk9p.apps.googleusercontent.com';
const RESULTS=[['大成功','big'],['成功','ok'],['失敗','ng']];
const RES_CLS={'大成功':'big','成功':'ok','失敗':'ng'};
const PLAN_ST=[['wishlist','購入予定'],['defined','購入済み'],['tentative','仮予定'],['unreleased','発売待ち']];
/* 手帖だけの扱い「購入予定」は、謎ログには仮予定(tentative)として送る */
const nzPlanId=p=>p==='wishlist'?'tentative':(p||'tentative');
const PLAN_LBL=Object.fromEntries(PLAN_ST);
const NZ_ORIGIN='https://www.nazo.site';
const TECHO_ORIGIN='https://ykdtmnhnddsbba-jj.github.io';
const DEFAULT_VENUE='リアル脱出ゲーム名古屋店';
const FORMATS=['ホール型','ルーム型','周遊型','ライブ型','持ち帰り型','Web謎','その他'];
/* 一覧の区分：公演（ホール・ルーム・ライブなど）／周遊／購入系（持ち帰り・Web謎・その他）。区分は一緒に表示しない */
const KINDS=[['show','公演'],['tour','周遊'],['buy','購入系']];
const kindOf=r=>r.format==='周遊型'?'tour':(r.format==='持ち帰り型'||r.format==='Web謎'||r.format==='その他')?'buy':'show';
const isBuy=r=>kindOf(r)==='buy';
const buyStage=r=>!isPlan(r)?'done':(r.nazolog_plan_status==='defined'?'owned':'wish');
function emptyDb(){return{schema_version:1,updated_at:null,records:{}}}
let db=Object.assign(emptyDb(),lsGet(LS_DB,{}));
if(!db.records||typeof db.records!=='object')db.records={};
let settings=Object.assign({google_client_id:'',drive_linked:false,nazolog_user_id:'bf53c570',gcal_id:''},lsGet(LS_SET,{}));
if(!settings.google_client_id)settings.google_client_id=DEFAULT_CLIENT_ID;
const TAB_KEYS=['plan','buy','reco','done','settings'];
const ui={tab:(()=>{const t=lsGet('techo_tab','plan');return TAB_KEYS.includes(t)?t:'plan'})(),planView:'month',buyView:'wish',doneView:'rec',kind:'show',q:'',group:'',result:'',format:[],year:'',status:'',sort:'new',shown:[],lq:'',lres:''};

function saveLocal(){db.updated_at=nowIso();lsSet(LS_DB,db)}
function save(){saveLocal();scheduleSync()}
function saveSettings(){lsSet(LS_SET,settings)}

/* =============== data ops =============== */
const isPlan=r=>r.status==='plan';
/* 参加予定（購入系を除く）でチケットのURLが無い → 警告。日付なし・日付が過ぎた予定は対象外 */
const hasTk=r=>/^https?:\/\//i.test(r.ticket_url||'');
const noTicket=r=>isPlan(r)&&kindOf(r)!=='buy'&&!hasTk(r)&&!!r.date&&r.date>=todayStr();

const nzSig=r=>[isPlan(r)?'plan':'done',r.result||'',r.date||'',r.time||'',isPlan(r)?nzPlanId(r.nazolog_plan_status):''].join('|');
const nzPending=r=>!r.deleted&&r.nazolog_sig!==nzSig(r);

function live(){return Object.entries(db.records).filter(([,r])=>r&&!r.deleted).map(([id,r])=>({id,...r}))}
// 書き込みはここ1か所に集約
function upsert(id,patch){
  const old=db.records[id];const alive=(old&&!old.deleted)?old:null;
  const cur=Object.assign({title:'',group:'',date:'',time:'',status:'',result:'',score:0,format:'',venue:'',impression:'',lesson:''},alive||{},patch);
  cur.created_at=cur.created_at||nowIso();cur.updated_at=stampAfter(alive||old);delete cur.deleted;
  db.records[id]=cur;save();return cur;
}
function removeRecord(id){const r=db.records[id];if(!r)return;db.records[id]={...r,deleted:true,updated_at:stampAfter(r)};save()}
// 同期用: 同じIDは updated_at が新しい方を採用（削除も tombstone として伝わる）
function mergeDb(a,b){
  const out=emptyDb();const x=a.records||{},y=b.records||{};
  new Set([...Object.keys(x),...Object.keys(y)]).forEach(id=>{
    const p=x[id],q=y[id];
    out.records[id]=!p?q:!q?p:((p.updated_at||'')>=(q.updated_at||'')?p:q);
  });
  out.updated_at=nowIso();return out;
}
function exportObj(){
  return{_readme:'謎解き手帖の公演記録 / リアル脱出ゲーム等の参加記録。records[ID]: title=公演名, group=団体, date=YYYY-MM-DD, result=大成功|成功|失敗(脱出結果), score=面白さ1-10(0は未評価), format=形式(ホール型/ルーム型/周遊型/ライブ型など), venue=会場・場所, impression=感想, lesson=教訓(次回に活かすこと), deleted=trueは削除済み。このJSONから成功/失敗の傾向、教訓の共通点、次に参加すべき公演を分析してください。',
    schema_version:1,updated_at:db.updated_at,records:db.records};
}

function importJson(text,overwrite){
  const j=JSON.parse(text);
  if(!j||typeof j.records!=='object'||j.records===null)throw new Error('謎解き手帖のJSON（records入り）ではありません');
  const before=live().length;
  const local=db.records||{};
  if(overwrite){
    /* 完全上書き: ファイルに入っている記録は、手元の値(結果・感想・削除を含む。点数だけは手元を残す)を捨ててファイルの内容に置き換える。ファイルにない記録は残す。 */
    const t=nowIso();
    Object.keys(j.records).forEach(id=>{const q=j.records[id];if(!q||q.deleted)return;const keep=local[id]&&!local[id].deleted?{score:local[id].score|0}:{};db.records[id]=Object.assign({},q,keep,{deleted:undefined,updated_at:t});});
    db.updated_at=t;save();
    return live().length-before;
  }
  db=mergeDb(db,{records:j.records});
  /* 読み込みでは、既存記録の「空欄」だけをファイル側の値で補完する（入力済みの値は上書きしない）。
     手元で先に編集した記録が新しい扱いになり、会場などの追記が反映されない問題を防ぐ。 */
  const FILL=['group','date','time','format','venue','impression','lesson','status','nazolog_content_id','nazolog_record_id','nazolog_plan_status','price','ticket_url','nazolog_synced_at'];
  Object.keys(j.records).forEach(id=>{
    const q=j.records[id],r=db.records[id];
    if(!q||q.deleted||!r||r.deleted||!local[id])return;
    let ch=false;
    FILL.forEach(k=>{if(!r[k]&&q[k]){r[k]=q[k];ch=true}});
    /* 形式「その他」は仮の値だったので、ファイル側に具体的な形式（Web謎など）があれば置き換える */
    if(r.format==='その他'&&q.format&&q.format!=='その他'){r.format=q.format;ch=true}
    if(ch)r.updated_at=stampAfter(r);
    /* 謎ログ由来の記録は「取り込んだ時点で謎ログと同じ」とみなす（署名を保存） */
    if(r.nazolog_record_id&&r.nazolog_synced_at&&!r.nazolog_sig)r.nazolog_sig=nzSig(r);
  });
  Object.keys(j.records).forEach(id=>{const q=j.records[id],r=db.records[id];if(q&&!q.deleted&&r&&!r.deleted&&r.nazolog_record_id&&r.nazolog_synced_at&&!r.nazolog_sig)r.nazolog_sig=nzSig(r)});
  save();
  return live().length-before;
}

/* =============== stats =============== */
function agg(rs,keyFn){
  const m=new Map();
  rs.forEach(r=>{
    const k=keyFn(r)||'（未設定）';
    const a=m.get(k)||{key:k,n:0,big:0,ok:0,ng:0,none:0,sSum:0,sN:0};
    a.n++;
    if(r.result==='大成功')a.big++;else if(r.result==='成功')a.ok++;else if(r.result==='失敗')a.ng++;else a.none++;
    if(r.score>0){a.sSum+=r.score;a.sN++}
    m.set(k,a);
  });
  return [...m.values()];
}
const byDate=(a,b)=>(a.date||'').localeCompare(b.date||'')||(a.created_at||'').localeCompare(b.created_at||'')||a.id.localeCompare(b.id);
function streaks(rs){
  const j=rs.filter(r=>r.result).sort(byDate);
  let best=0,run=0;
  j.forEach(r=>{if(isWin(r)){run++;if(run>best)best=run}else run=0});
  let cur={type:'win',n:0};
  if(j.length){
    const lastWin=isWin(j[j.length-1]);cur={type:lastWin?'win':'lose',n:0};
    for(let i=j.length-1;i>=0&&isWin(j[i])===lastWin;i--)cur.n++;
  }
  return{best,cur};
}
function summary(rs){
  const a=agg(rs,()=>'x')[0]||{n:0,big:0,ok:0,ng:0,none:0,sSum:0,sN:0};
  const judged=a.big+a.ok+a.ng;
  return{...a,judged,rate:judged?(a.big+a.ok)/judged:null,avgScore:a.sN?a.sSum/a.sN:null};
}
const pct=x=>x==null?'—':Math.round(x*100)+'%';

/* =============== filters =============== */
function filtered(){
  let a=live();
  const q=ui.q.trim().toLowerCase();
  if(q)a=a.filter(r=>[r.title,r.group,r.impression,r.lesson,r.venue,r.format].join('\n').toLowerCase().includes(q));
  if(ui.group)a=a.filter(r=>r.group===ui.group);
  if(ui.result)a=a.filter(r=>ui.result==='none'?!r.result:r.result===ui.result);
  a=a.filter(r=>!isPlan(r)&&kindOf(r)===ui.kind);
  a=a.filter(matchFmt);
  if(ui.year)a=a.filter(r=>(r.date||'').slice(0,4)===ui.year);
  if(ui.sort==='old')a.sort(byDate);
  else if(ui.sort==='score')a.sort((x,y)=>(y.score||0)-(x.score||0)||byDate(y,x));
  else a.sort((x,y)=>byDate(y,x));
  return a;
}
function countBy(rs,f){const m=new Map();rs.forEach(r=>{const k=f(r);if(k)m.set(k,(m.get(k)||0)+1)});return[...m.entries()].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]))}

let gToken=null,gExp=0,gClient=null,driveFileId=null,syncState=settings.drive_linked?'need':'off',syncTimer=null,syncing=false;
const G_SCOPE='https://www.googleapis.com/auth/drive.file';

/* 認証はポップアップではなくページ遷移（リダイレクト）方式。Sleipnir等のアプリ内ブラウザでも動く */
(function(){
  try{
    if(/access_token=|error=/.test(location.hash)){
      const p=new URLSearchParams(location.hash.slice(1));
      const stSaved=(()=>{try{return sessionStorage.getItem('gauth_state')||localStorage.getItem('gauth_state')}catch(e){return null}})();
      if(p.get('state')&&p.get('state')===stSaved){
        if(p.get('access_token'))sessionStorage.setItem(G_TOKKEY,JSON.stringify({t:p.get('access_token'),e:Date.now()+(+p.get('expires_in')||3600)*1000}));
        try{sessionStorage.removeItem('gauth_state');localStorage.removeItem('gauth_state')}catch(e){}
        history.replaceState(null,'',location.pathname+location.search);
      }
    }
    const s=JSON.parse(sessionStorage.getItem(G_TOKKEY)||'null');

  }catch(e){}
})();
function gRedirect(prompt){
  const st=Math.random().toString(36).slice(2)+Date.now().toString(36);

  try{localStorage.setItem('gauth_state',st)}catch(e){}

/* 起動時：トークンがあれば同期、無ければ1回だけ無言で再認証を試す（ループ防止つき） */
function gStartup(){
  if(!settings.google_client_id)return;
  if(gToken){driveSync(false);return}
  if(!settings.drive_linked)return;
  let last=0;try{last=+sessionStorage.getItem('gauth_silent')||0}catch(e){}

window.addEventListener('pageshow',e=>{if(e.persisted){syncing=false;setSync('need')}});
const gFetch=(url,opt={})=>fetch(url,{...opt,headers:{...(opt.headers||{}),Authorization:'Bearer '+gToken}});
async function driveSync(interactive){
  if(syncing)return;syncing=true;setSync('busy');let changed=false;
  try{
    if(!gToken||Date.now()>gExp-60000)await driveAuth(interactive);
    let id=driveFileId;
    if(!id){
      const q=encodeURIComponent(`name='${DRIVE_FILE}' and trashed=false`);
      const r=await gFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id)&orderBy=${encodeURIComponent('modifiedTime desc')}&pageSize=1`);
      if(!r.ok)throw new Error('Drive検索に失敗 ('+r.status+')。Drive APIが有効か確認してください');
      const j=await r.json();id=j.files&&j.files[0]&&j.files[0].id;
    }
    if(id){
      const r=await gFetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`);
      // 読み込めないまま書き込むと既存データを失うので、必ず中断する
      if(!r.ok)throw new Error('Driveの読み込みに失敗 ('+r.status+')。保存は中止しました');
      const remote=await r.json();
      const sig0=JSON.stringify(db.records);
      db=mergeDb(db,{records:(remote&&remote.records)||{}});saveLocal();
      if(JSON.stringify(db.records)!==sig0)changed=true;
    }
    const body=JSON.stringify(exportObj(),null,1);
    if(id){
      const r=await gFetch(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media`,{method:'PATCH',headers:{'Content-Type':'application/json'},body});
      if(!r.ok)throw new Error('Drive保存に失敗 ('+r.status+')');
    }else{
      const b='nazotodb'+Date.now();
      const meta=JSON.stringify({name:DRIVE_FILE,mimeType:'application/json'});
      const mp=`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${meta}\r\n--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${body}\r\n--${b}--`;
      const r=await gFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body:mp});
      if(!r.ok)throw new Error('Drive作成に失敗 ('+r.status+')');
      id=(await r.json()).id;
    }
    driveFileId=id;settings.drive_linked=true;saveSettings();setSync('ok');
    if(changed)render();
    return true;
  }catch(e){setSync(interactive?'bad':'need');if(interactive)toast(e.message,5000);console.warn(e);return false}
  finally{syncing=false}
}

async function gcSend(ids){
  if(gcBusy)return;
  ids=ids.filter(id=>gcEligible(db.records[id]));
  if(!ids.length)return;
  gcBusy=true;let ok=0,fail=0,msg='';
  for(const id of ids){
    const r=db.records[id];
    try{await gcPut({id,...r});db.records[id]=Object.assign({},r,{gcal_sig:gcSig(r),gcal_synced_at:nowIso(),updated_at:stampAfter(r)});ok++}
    catch(e){fail++;msg=e.message;if(e.message==='auth')break}
    await new Promise(f=>setTimeout(f,150));
  }
  gcBusy=false;if(ok)save();render();
  if(msg==='auth'){toast('カレンダーの認証が切れました。もう一度押してください',4000);try{sessionStorage.removeItem(GC_TOKKEY)}catch(e){}}
  else if(fail)toast(`カレンダーに${ok}件登録、${fail}件失敗：${msg}`,9000);
  else toast(`ファミリー カレンダーに${ok}件登録しました`);
}
function gcStartup(){
  let ids=null;try{ids=JSON.parse(localStorage.getItem(GC_PEND)||'null');localStorage.removeItem(GC_PEND)}catch(e){}

const RC_FMT={hall:'ホール型',room:'ルーム型',field:'周遊型',stadium:'周遊型',cube:'ルーム型',cafe:'その他',web:'Web謎',kit:'持ち帰り型'};

const normT=t=>String(t||'').replace(/[\s　~〜～\-－・:：!！?？()（）「」『』]/g,'').toLowerCase();
function recoDone(it,all){
  const n=normT(it.title);

function recoPlan(it,all){

  return all.some(r=>isPlan(r)&&(r.nazolog_content_id===it.contentId||normT(r.title)===n));
}
function recoWhy(it,all){
  const done=all.filter(r=>!isPlan(r)),w=[];
  const fm=RC_FMT[it.category];
  const sc=a=>{const v=a.filter(r=>r.score>0);return v.length?(v.reduce((x,r)=>x+r.score,0)/v.length):0};
  const g=it.group?done.filter(r=>r.group===it.group):[];
  if(g.length){const a=sc(g);w.push(`${it.group}は${g.length}件参加済み`+(a?`（平均面白さ${a.toFixed(1)}）`:''))}
  else if(it.group&&done.length)w.push(`${it.group}は未参加の団体`);
  const f=fm?done.filter(r=>r.format===fm):[];
  if(f.length>=3){const a=sc(f);if(a>=7)w.push(`${fm}は平均${a.toFixed(1)}と好み`)}
  const vv=done.filter(r=>r.venue&&it.venue&&(r.venue.includes(it.venue)||it.venue.includes(r.venue)));
  if(vv.length)w.push(`この会場は${vv.length}回行っている`);
  return w.slice(0,2).join('・');
}
function recoView(){
  const d=recoData,st=ui.reco,all=live();
  /* st.m=-1 は「今月＋来月」（全期間のあいだに重なる公演を1回ずつ） */
  const ms=st.m<0?d.months:[d.months[st.m]],mk=ms[0],[y,mo]=ms[ms.length-1].split('-').map(Number);
  const first=mk+'-01',last=ms[ms.length-1]+'-'+String(new Date(y,mo,0).getDate()).padStart(2,'0');
  const today=new Date(Date.now()+9*3600e3).toISOString().slice(0,10);
  let rows=d.items.filter(it=>it.start<=last&&(it.end==null||it.end>=first));
  const kinds=countBy(rows,rcKind);
  rows=rows.filter(it=>rcKind(it)===st.kind);
  const nPerm=rows.filter(it=>it.permanent).length;
  const cats=countBy(rows,it=>RC_CAT[it.category]||it.category);
  if(!st.perm)rows=rows.filter(it=>!it.permanent);
  if(st.cat.length)rows=rows.filter(it=>st.cat.includes(RC_CAT[it.category]||it.category));
  rows=rows.map(it=>({it,done:recoDone(it,all),plan:recoPlan(it,all)}));

  return{rows,cats,nPerm,mk,today,kinds};

  if(past.length){h+=`<div class="gh">日付が過ぎた予定<small>参加済みにするか、日付を直してください</small></div>`;past.forEach(r=>{h+=card(r)})}

  else{let cur='';rs.forEach(r=>{if(r.date!==cur){cur=r.date;h+=`<div class="gh">${esc(all?fmtDate(cur):lbl(cur))}</div>`}h+=card(r)})}
  if(all&&nd.length){h+=`<div class="gh">日付未定</div>`;nd.forEach(r=>{h+=card(r)})}
  m.innerHTML=sub+h;
  $('#plV').onclick=e=>{const b=e.target.closest('button');if(!b)return;ui.planView=b.dataset.v;render()};
  m.onclick=e=>{const b=e.target.closest('.wkEdit');if(b){openEdit(b.dataset.id);return}
    const d=e.target.closest('.wkDone');if(d){markDone(d.dataset.id)}};

/* ---- 買い物（購入系の予定）：買う予定 → 手元にある（未プレイ） → 遊んだら実績へ ---- */
const buyItems=st=>live().filter(r=>isBuy(r)&&isPlan(r)&&buyStage(r)===st);
const yen=n=>'¥'+Number(n||0).toLocaleString();
function renderBuy(m){
  const wish=buyItems('wish'),own=buyItems('owned'),v=ui.buyView==='owned'?'owned':'wish';
  const sum=a=>a.reduce((t,r)=>t+(+r.price||0),0);
  const sort=a=>a.sort((x,y)=>(x.date||'9999').localeCompare(y.date||'9999')||x.title.localeCompare(y.title));
  const rs=sort(v==='wish'?wish:own),tot=sum(rs),noPr=rs.filter(r=>!(+r.price)).length;
  const sub=`<div class="stick"><div class="subtabs sm" id="byV"><button type="button" class="${v==='wish'?'on':''}" data-v="wish">買う予定<small>${wish.length}</small></button><button type="button" class="${v==='owned'?'on':''}" data-v="owned">手元にある（未プレイ）<small>${own.length}</small></button></div></div>`;
  const card=r=>{
    const tu=/^https?:\/\//i.test(r.ticket_url||'')?r.ticket_url:'';
    const nz=r.nazolog_content_id?`<a class="btn" href="https://www.nazo.site/content/contents/${esc(r.nazolog_content_id)}" target="_blank" rel="noopener">謎ログ ↗</a>`:'';
    const act=v==='wish'?`<button type="button" class="btn pri byGot" data-id="${esc(r.id)}">✔ 買った</button>`:`<button type="button" class="btn pri byDone" data-id="${esc(r.id)}">✔ 遊んだ（実績へ）</button>`;
    return`<div class="bycard"><div class="pr">${+r.price?yen(r.price):'<span class="hint">価格未登録</span>'}<small>${r.date?esc(fmtDate(r.date)):'日付なし'}</small></div><div><div class="ttl">${esc(r.title)}${nzPending(r)?' <span class="un" title="謎ログに未反映">未反映</span>':''}</div>
      <div class="meta">${esc([r.group,r.format].filter(Boolean).join(' ／ '))}</div>
      <div class="row" style="margin-top:8px">${act}${tu?`<a class="btn" href="${esc(tu)}" target="_blank" rel="noopener">🛒 購入ページ</a>`:''}${nz}${gcEligible(r)?gcBtn(r,'btn'):''}<button type="button" class="btn byEdit" data-id="${esc(r.id)}">編集</button></div></div></div>`;
  };
  let h=`<div class="totbar"><span>${v==='wish'?'買う予定':'手元にある'}<b>${rs.length}</b>件</span><span>合計<b>${yen(tot)}</b>${noPr?`（価格未登録 ${noPr}件）`:''}</span></div>`;
  h+=rs.length?rs.map(card).join(''):`<div class="empty">${v==='wish'?'買う予定のものはありません。<br>「オススメ」の購入系から「予定に入れる」か、＋追加で入れられます。':'手元にある未プレイのものはありません。'}</div>`;
  m.innerHTML=sub+h;
  $('#byV').onclick=e=>{const b=e.target.closest('button');if(!b)return;ui.buyView=b.dataset.v;render()};
  m.onclick=e=>{const b=e.target.closest('button');if(!b||!b.dataset.id)return;const id=b.dataset.id;
    if(b.classList.contains('byEdit'))openEdit(id);
    else if(b.classList.contains('byGot')){upsert(id,{nazolog_plan_status:'defined'});render();toast('「手元にある」に移しました')}
    else if(b.classList.contains('byDone'))markDone(id)};
}

function drawList(){
  const rs=filtered();ui.shown=rs.map(r=>r.id);

    box.innerHTML=live().length?'<div class="empty">条件に合う記録がありません。</div>'
      :'<div class="empty">まだ記録がありません。<br>右上の「＋ 追加」から感想を書き始められます。<br>Notionなどからの移行データは「設定」→「JSONを読み込む」で取り込めます。</div>';

function updateSummary(){
  const el=$('#sum');if(!el)return;

function refreshRow(row,id){
  const r=db.records[id];if(!r||!row)return;
  row.querySelectorAll('.rb').forEach(b=>b.classList.toggle('on',b.dataset.r===r.result));
  row.querySelectorAll('.sb').forEach(b=>b.classList.toggle('on',+b.dataset.s===(r.score|0)));

function listClick(e){
  const row=e.target.closest('.rec');if(!row)return;
  const id=row.dataset.id,r=db.records[id];if(!r)return;
  const rb=e.target.closest('.rb'),sb=e.target.closest('.sb');
  if(rb){upsert(id,{result:r.result===rb.dataset.r?'':rb.dataset.r});refreshRow(row,id);updateSummary();return}
  if(sb){const s=+sb.dataset.s;upsert(id,{score:(r.score|0)===s?0:s});refreshRow(row,id);updateSummary();return}
  if(e.target.closest('.dn')){upsert(id,{status:''});drawList();render();toast('参加済みにしました。結果を選んでください');return}
  if(e.target.closest('.ed')){openEdit(id);return}

/* ---- stats ---- */
function barRow(a,maxN){
  const w=x=>(maxN?x/maxN*100:0)+'%';
  const judged=a.big+a.ok+a.ng;
  return`<div class="brow"><div class="nm" title="${esc(a.key)}">${esc(a.key)}</div>
    <div class="track"><i class="s-big" style="width:${w(a.big)}"></i><i class="s-ok" style="width:${w(a.ok)}"></i><i class="s-ng" style="width:${w(a.ng)}"></i><i class="s-none" style="width:${w(a.none)}"></i></div>
    <div class="st">${a.n}公演 ・ ${pct(judged?(a.big+a.ok)/judged:null)}${a.sN?` ・ ★${(a.sSum/a.sN).toFixed(1)}`:''}</div></div>`;
}
function barBlock(title,list,note){
  const maxN=Math.max(1,...list.map(a=>a.n));
  return`<div class="panel"><h2>${title}</h2>${note?`<div class="hint" style="margin-bottom:6px">${note}</div>`:''}${list.length?list.map(a=>barRow(a,maxN)).join(''):'<div class="hint">データなし</div>'}</div>`;
}
function renderStats(m){
  const allRs=live().filter(r=>!isPlan(r));

  if(!allRs.length){m.innerHTML=`<div class="stick">${doneTabs()}</div><div class="empty">記録が増えると、ここに成功率や連勝記録が表示されます。</div>`;bindDoneTabs();return}
  const s=summary(rs),st=streaks(rs);
  const curTxt=st.cur.n?(st.cur.type==='win'?st.cur.n+'連勝中':st.cur.n+'連敗中'):'—';
  const groups=agg(rs,r=>r.group).sort((a,b)=>b.n-a.n);
  const months=agg(rs,r=>(r.date||'').slice(0,7)).sort((a,b)=>b.key.localeCompare(a.key));
  const fmts=agg(rs,r=>r.format).sort((a,b)=>b.n-a.n);
  const recent=rs.filter(r=>r.result).sort(byDate).slice(-10);
  const rs10=summary(recent);
  m.innerHTML=`
  <div class="stick">${doneTabs()}${fmtBtns(allRs)}</div>
  <div class="tiles">
    <div class="tile"><div class="k">公演数</div><div class="v">${s.n}<small>公演</small></div></div>
    <div class="tile"><div class="k">成功率（大成功＋成功）</div><div class="v">${pct(s.rate)}</div></div>
    <div class="tile"><div class="k">直近10公演の成功率</div><div class="v">${pct(rs10.rate)}</div></div>
    <div class="tile"><div class="k">大成功</div><div class="v">${s.big}<small>回</small></div></div>
    <div class="tile"><div class="k">現在の記録</div><div class="v">${curTxt}</div></div>
    <div class="tile"><div class="k">最長連勝</div><div class="v">${st.best}<small>連勝</small></div></div>
    <div class="tile"><div class="k">面白さ平均</div><div class="v">${s.avgScore!=null?s.avgScore.toFixed(1):'—'}<small>${s.sN}件評価</small></div></div>
  </div>
  <div class="legend"><span><i style="background:var(--gold)"></i>大成功</span><span><i style="background:var(--teal)"></i>成功</span><span><i style="background:var(--pink)"></i>失敗</span><span><i style="background:#4a4f6e"></i>結果なし</span><span>★=面白さ平均</span></div>

    ${barBlock('形式別',fmts,'形式が未入力の公演は「（未設定）」')}
  </div>

}

/* ===== 謎ログ側で動くブックマークレット（この関数が文字列として謎ログのタブに渡る） ===== */
function nzBookmarklet(){
  var TECHO='https://ykdtmnhnddsbba-jj.github.io',NZ='https://www.nazo.site';
  if(location.origin!==NZ){alert('このボタンは、手帖の「謎ログに反映」から開いた謎ログのタブで押してください');return}
  if(!window.opener){alert('手帖の「謎ログに反映」ボタンから開いたタブで押してください');return}
  if(document.getElementById('nz-panel'))return;
  var api=document.querySelector('#__nuxt').__vue_app__.config.globalProperties.$api;
  var wait=function(ms){return new Promise(function(r){setTimeout(r,ms)})};
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
  var core=function(t){return String(t||'').normalize('NFKC').replace(/【[^】]*】/g,'').replace(/^(名探偵コナン|ダンダダン|リドラの脱出BOX)\s*/,'').replace(/[『』「」]/g,'').trim()};
  var norm=function(t){return core(t).replace(/[\s~〜～・!！?？。、,.:：\-－_()（）\[\]]/g,'').replace(/噓/g,'嘘').toLowerCase()};
  var P=document.createElement('div');P.id='nz-panel';
  P.style.cssText='position:fixed;top:12px;right:12px;width:520px;max-width:94vw;max-height:88vh;overflow:auto;z-index:2147483647;background:#fff;color:#222;border:2px solid #f90;border-radius:12px;padding:14px;font:14px/1.5 sans-serif;box-shadow:0 6px 30px rgba(0,0,0,.35)';
  document.body.appendChild(P);
  var show=function(h){P.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center"><b>謎解き手帖 → 謎ログ に反映</b><button id="nz-x" style="border:0;background:none;font-size:18px;cursor:pointer">×</button></div><div style="margin-top:8px">'+h+'</div>';P.querySelector('#nz-x').onclick=function(){P.remove();window.removeEventListener('message',onMsg)}};
  var uid='',items=[];
  async function search(title){
    var c=core(title),kws=[c];if(c.length>8)kws.push(c.slice(0,8));
    var seen={},out=[];
    for(var i=0;i<kws.length;i++){
      var r=await api('/contents',{query:{per:8,'q[keyword]':kws[i]}});
      (r.contents||[]).forEach(function(x){if(!seen[x.id]){seen[x.id]=1;out.push({id:x.id,title:x.title,rel:x.releaseDate})}});
      await wait(700);
    }
    return out;
  }
  async function plan(){
    show('作品を照合中…（'+items.length+'件）');
    var rows=[];
    for(var i=0;i<items.length;i++){
      var it=items[i],row={it:it,cid:it.cid||'',cands:[],auto:!!it.cid};
      if(!row.cid){
        try{row.cands=await search(it.title)}catch(e){row.err=String(e)}
        var ex=row.cands.filter(function(c){return norm(c.title)===norm(it.title)});
        if(ex.length===1){row.cid=ex[0].id;row.auto=true}
      }
      rows.push(row);
    }
    var h='<div style="font-size:12px;color:#666">確認して「実行」を押すと、謎ログに<b>非公開</b>で記録します（1件ずつ間隔をあけて処理）。</div><table style="width:100%;border-collapse:collapse;margin-top:8px;font-size:13px">';
    rows.forEach(function(r,i){
      var st=r.it.plan?'予定':'参加済';
      h+='<tr style="border-top:1px solid #ddd"><td style="padding:4px 2px;vertical-align:top"><b>'+esc(r.it.title)+'</b><br><span style="color:#666">'+esc(r.it.date||'日付なし')+(r.it.time?' '+esc(r.it.time):'')+' ・ '+st+' → '+esc(r.it.nz_status)+'</span></td><td style="padding:4px 2px;vertical-align:top;width:190px">';
      if(r.auto)h+='<span style="color:#0a7">✔ '+(r.it.cid?'紐づけ済み':'作品一致')+'</span>'+(r.cid&&!r.it.cid?'<br><span style="font-size:11px;color:#888">'+esc((r.cands.find(function(c){return c.id===r.cid})||{}).title||'')+'</span>':'');
      else{
        h+='<select data-i="'+i+'" style="max-width:190px"><option value="">（スキップ）</option>'+r.cands.map(function(c){return'<option value="'+esc(c.id)+'">'+esc(c.title)+(c.rel?'（'+esc(c.rel.slice(0,4))+'）':'')+'</option>'}).join('')+'</select>'+(r.cands.length?'':'<br><span style="font-size:11px;color:#c00">候補なし</span>');
      }
      h+='</td></tr>';
    });
    h+='</table><div style="margin-top:10px;display:flex;gap:8px"><button id="nz-run" style="background:#f90;border:0;border-radius:8px;padding:8px 16px;font-weight:700;cursor:pointer">実行</button><button id="nz-cancel" style="padding:8px 14px;border-radius:8px;cursor:pointer">キャンセル</button></div>';
    show(h);
    P.querySelectorAll('select[data-i]').forEach(function(s){s.onchange=function(){rows[+s.dataset.i].cid=s.value}});
    P.querySelector('#nz-cancel').onclick=function(){P.remove();window.removeEventListener('message',onMsg)};
    P.querySelector('#nz-run').onclick=function(){run(rows)};
  }
  async function runGroup(g){
    var rid=g.items.map(function(i){return i.rid}).filter(Boolean)[0],rec=null;
    if(rid)rec=await api('/content_records/'+rid);
    else{
      var l=await api('/content_records',{query:{'q[user_id_eq]':uid,'q[content_id_eq]':g.cid,per:5}});await wait(700);
      if(l.contentRecords&&l.contentRecords[0])rec=await api('/content_records/'+l.contentRecords[0].id);
    }
    var ex=(rec&&rec.contentPlays)||[],plays=[],used={};
    g.items.forEach(function(it){
      if(!it.date||used[it.date])return;used[it.date]=1;
      var o={play_date:it.date},e=ex.filter(function(p){return p.playDate===it.date})[0];
      if(it.time)o.play_time=it.time;
      if(e)o.id=e.id;
      plays.push(o);
    });
    var latest=g.items.slice().sort(function(a,b){return String(b.date).localeCompare(String(a.date))})[0];
    var cr={content_record_status_id:latest.nz_status};
    if(plays.length)cr.content_plays_attributes=plays;
    if(rec){await api('/content_records/'+rec.id,{method:'PATCH',body:{content_record:cr}});return{rid:rec.id,mode:'更新'}}
    cr.content_id=g.cid;cr.user_id=uid;cr.disclosure='close';cr.test_play=false;cr.repeat=false;
    /* 新規登録はフォーム形式(multipart)で送る必要がある（JSONだと500になる） */
    var fd=new FormData();
    Object.keys(cr).forEach(function(k){
      if(k==='content_plays_attributes'){cr[k].forEach(function(p,i){Object.keys(p).forEach(function(pk){fd.append('content_record[content_plays_attributes]['+i+']['+pk+']',p[pk])})})}
      else fd.append('content_record['+k+']',cr[k]);
    });
    if(!cr.content_plays_attributes)fd.append('content_record[content_plays_attributes][]','');
    ['status','content_scene','play_datetime','team','time'].forEach(function(k){fd.append('content_record['+k+'_disclosure]','open')});
    var r=await api('/content_records',{method:'POST',body:fd});
    return{rid:r.id,mode:'新規'};
  }
  async function run(rows){
    var groups={},results=[],skipped=0;
    rows.forEach(function(r){if(!r.cid){skipped++;results.push({local_id:r.it.local_id,status:'skip'});return}(groups[r.cid]=groups[r.cid]||{cid:r.cid,items:[]}).items.push(r.it)});
    var keys=Object.keys(groups),log=[],ok=0;
    for(var k=0;k<keys.length;k++){
      var g=groups[keys[k]];
      show('反映中… '+(k+1)+' / '+keys.length+'<br><span style="font-size:12px;color:#666">'+esc(g.items[0].title)+'</span>');
      try{
        var res=await runGroup(g);ok++;
        g.items.forEach(function(it){results.push({local_id:it.local_id,status:'ok',cid:g.cid,rid:res.rid})});
        log.push('✔ '+res.mode+'：'+esc(g.items[0].title));
      }catch(e){
        g.items.forEach(function(it){results.push({local_id:it.local_id,status:'error'})});
        log.push('✖ 失敗：'+esc(g.items[0].title)+'（'+esc(String(e&&e.message||e))+'）');
        break;
      }
      await wait(700);
    }
    window.opener.postMessage({t:'nz-result',results:results},TECHO);
    show('<b>'+ok+'件を反映しました</b>'+(skipped?'（スキップ '+skipped+'件）':'')+'<div style="margin-top:8px;font-size:13px">'+log.join('<br>')+'</div><div style="margin-top:8px;font-size:12px;color:#666">結果は手帖に送りました。手帖のタブに戻って確認してください。</div>');
  }
  function onMsg(e){
    if(e.source!==window.opener||e.origin!==TECHO||!e.data||e.data.t!=='nz-items')return;
    uid=e.data.user_id;items=e.data.items||[];
    if(!items.length){show('反映する記録はありません（すべて反映済みです）。');return}
    plan().catch(function(err){show('エラー：'+esc(String(err&&err.message||err)))});
  }
  window.addEventListener('message',onMsg);
  show('手帖から未反映の記録を受け取っています…');
  window.opener.postMessage({t:'nz-hello'},TECHO);
}

/* =============== 謎ログ連携（手帖側） =============== */
function nzItems(){
  return live().filter(nzPending).map(r=>({local_id:r.id,title:r.title,date:r.date||'',time:r.time||'',plan:isPlan(r),nz_status:nzStatusId(r),cid:r.nazolog_content_id||'',rid:r.nazolog_record_id||''}));
}
function bmHref(){return 'javascript:('+encodeURIComponent(nzBookmarklet.toString())+')()'}
window.addEventListener('message',e=>{
  if(e.origin!==NZ_ORIGIN||!e.data||typeof e.data!=='object')return;
  if(e.data.t==='nz-hello'){
    /* 謎ログに渡すのは、作品名・日付・時刻・ステータスだけ。感想・評価・教訓は送らない */
    e.source.postMessage({t:'nz-items',user_id:settings.nazolog_user_id,items:nzItems()},e.origin);
  }else if(e.data.t==='nz-result'&&Array.isArray(e.data.results)){
    const t=nowIso();let n=0;
    e.data.results.forEach(x=>{
      const r=db.records[x&&x.local_id];if(!r||r.deleted||!x||x.status!=='ok')return;
      db.records[x.local_id]=Object.assign({},r,{nazolog_content_id:String(x.cid||''),nazolog_record_id:String(x.rid||''),nazolog_synced_at:t});
      db.records[x.local_id].nazolog_sig=nzSig(db.records[x.local_id]);
      db.records[x.local_id].updated_at=stampAfter(r);n++;
    });
    if(n){save();render();toast(`謎ログに ${n}件 反映しました`,4000)}
  }
});
function updateNzBtn(){
  const b=$('#nzBtn');if(!b)return;const n=nzItems().length;
  b.textContent=n?`謎ログに反映（${n}）`:'謎ログに反映';
  b.style.borderColor=n?'var(--gold)':'';b.style.color=n?'var(--gold)':'';
}
function nzPanelHtml(){
  const items=nzItems();
  return`<p class="hint">未反映の記録を、謎ログに<b>非公開</b>で登録・更新します。謎ログに送るのは「作品名・日付・時刻・ステータス（成功/失敗/参加済み/予定）」だけで、感想・評価・教訓は送りません。</p>
  <ol class="hint" style="line-height:1.9">
    <li>下の「謎ログを開く」を押す（新しいタブで謎ログが開きます。サインインしておく）</li>
    <li>そのタブで、ブックマークバーの <b>「謎ログに反映」</b> を押す</li>
    <li>確認画面で内容を見て「実行」を押す。結果はこの手帖に自動で戻ります</li>
  </ol>
  <p class="hint">初回だけ、このリンクをブックマークバーにドラッグして登録してください： <a href="${bmHref()}" class="btn" style="display:inline-block;text-decoration:none" onclick="event.preventDefault();alert('このリンクはブックマークバーへドラッグして登録してください。登録後、謎ログのタブで押します。');">⭐ 謎ログに反映</a></p>
  <p class="hint">未反映 ${items.length}件${items.length?'：':''}${items.slice(0,8).map(i=>esc(i.title)).join('、')}${items.length>8?' ほか':''}</p>`;
}
function openNzModal(){
  $('#modalRoot').innerHTML=`<div class="ov" id="ov"><div class="modal"><h2>謎ログに反映</h2>${nzPanelHtml()}<div class="row"><button class="btn pri" id="nzOpen">謎ログを開く</button><button class="btn" id="nzClose">閉じる</button></div></div></div>`;
  $('#ov').addEventListener('mousedown',e=>{if(e.target.id==='ov')closeModal()});
  $('#nzClose').onclick=closeModal;
  $('#nzOpen').onclick=()=>{window.open(NZ_ORIGIN+'/','nazolog_sync')};
}

/* =============== init =============== */
function goTab(t){ui.tab=t;lsSet('techo_tab',t);if(isMobile())setHdr(true);window.scrollTo(0,0);render()}
$('#nav').onclick=e=>{const b=e.target.closest('button');if(!b)return;goTab(b.dataset.tab)};
let prevTab=ui.tab==='settings'?'plan':ui.tab;
$('#gearBtn').onclick=()=>{if(ui.tab==='settings')goTab(prevTab);else{prevTab=ui.tab;goTab('settings')}};
/* 開いているタブに合わせて初期値を変える：予定タブ＝予定、買い物＝購入予定 */
$('#addBtn').onclick=()=>openEdit(null,ui.tab==='plan'?{status:'plan'}:ui.tab==='buy'?{status:'plan',nazolog_plan_status:ui.buyView==='owned'?'defined':'wishlist',format:'持ち帰り型',venue:'',date:''}:null);
$('#nzBtn').onclick=openNzModal;
$('#syncChip').onclick=()=>{if(!settings.google_client_id){goTab('settings');return}driveSync(true)};
window.addEventListener('resize',applyHdr);
$('#hdrToggle').onclick=()=>setHdr(!hdrCollapsed);
applyHdr();
render();
gStartup();
gcStartup();
</script>
