name: update-recommend

on:
  schedule:
    - cron: "17 21 * * 0"   # 毎週月曜 06:17 JST（毎日にする場合は "17 21 * * *"）
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch recommendations
        run: python3 scripts/fetch_recommend.py recommend.json
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recommend.json
          if git diff --cached --quiet; then echo "no changes"; else
            git commit -m "update recommend.json"
            git push
          fi
